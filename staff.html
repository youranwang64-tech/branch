<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>branch · 工作人员后台</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./refined-ui.css"></head><body><main style="max-width:850px;margin:70px auto;padding:25px"><p class="eyebrow">PARALLAX / STAFF ONLY</p><h1>报名与现场档案</h1><p>仅授权工作人员可读取资料。报名编码不会向公众开放查询。</p><form id="login"><label class="field">工作人员邮箱<input class="input" id="email" type="email" required autocomplete="username"></label><label class="field">密码<input class="input" id="password" type="password" required autocomplete="current-password"></label><button class="btn">登录</button></form><section id="desk" hidden><button class="btn secondary" id="logout">退出登录</button><form id="lookup"><label class="field">现场编码<input class="input" id="code" pattern="BR-[A-Fa-f0-9]{16}" placeholder="BR-…" required></label><button class="btn">查找报名资料</button></form><article id="record"></article><div id="actions" hidden><button class="btn" id="prepare">在活动电脑预生成人生</button><button class="btn secondary" id="export" disabled>下载现场人生档案</button><p>预生成在本机运行，需先启动 branch 后台。活动现场导入人生档案，即可阅读与改写。</p></div></section><p id="status" role="status" style="white-space:pre-wrap;margin-top:24px"></p></main><script type="module" src="./staff.js"></script></body></html>
